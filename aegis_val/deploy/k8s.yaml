apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-val-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegis-val-api
  template:
    metadata:
      labels:
        app: aegis-val-api
    spec:
      containers:
      - name: api
        image: aegis-val-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: url
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-val-service
spec:
  selector:
    app: aegis-val-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
